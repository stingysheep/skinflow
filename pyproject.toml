[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "skinflow-workspace"
version = "0.1.2"
description = "Local CS2 semi-automatic trading workspace"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "aiohttp>=3.12,<4",
  "pydantic-settings>=2.10,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
desktop = ["pywebview>=6.2,<7"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
release = ["pyinstaller>=6.0,<7"]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/skinflow_api", "apps/desktop/skinflow_desktop"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/desktop"]
testpaths = ["apps/api/tests", "apps/desktop/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api", "apps/desktop"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
